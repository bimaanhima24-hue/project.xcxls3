<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharma Analytics & Queue Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-2xl w-full text-center space-y-6">
    <h1 class="text-3xl font-bold text-slate-900">Portal Analisis & Antrean Farmasi</h1>
    <p class="text-slate-600">Pilih modul aplikasi yang ingin digunakan:</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
      <a href="pharma-suite/pharm-analyst-staff" class="block p-6 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 transition">
        <h2 class="text-xl font-semibold text-blue-600 mb-2">PharmLoad (Staff Analyst)</h2>
        <p class="text-sm text-slate-500">Simulasi kapasitas petugas, utilisasi per jam, dan analisis beban kerja resep.</p>
      </a>

      <a href="pharma-suite/pharma-queue" class="block p-6 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-emerald-500 transition">
        <h2 class="text-xl font-semibold text-emerald-600 mb-2">Pharma Queue</h2>
        <p class="text-sm text-slate-500">Pemantauan dan simulasi alur antrean pasien instalasi farmasi.</p>
      </a>
    </div>
  </div>
</body>
</html>
