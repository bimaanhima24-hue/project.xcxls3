<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratinjau Dokumen Excel - project.xcxls</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            background-color: #1f2937;
            color: #ffffff;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tab-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background-color: #374151;
            color: #e5e7eb;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s ease;
        }
        .tab-btn:hover {
            background-color: #4b5563;
        }
        .tab-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
        }
        .download-link {
            padding: 8px 12px;
            border-radius: 6px;
            background-color: #059669;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
        }
        .download-link:hover {
            background-color: #047857;
        }
        .viewer-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="tabs" id="fileTabs">
            <button
                class="tab-btn active"
                data-raw="https://raw.githubusercontent.com/bimaanhima24-hue/project.xcxls/main/DATA%20PENGUNJUNG%20FARMASI%20OKT-DESem.xlsx"
                onclick="switchFile(this)">
                Data Pengunjung Farmasi Okt-Des
            </button>
            <button
                class="tab-btn"
                data-raw="https://raw.githubusercontent.com/bimaanhima24-hue/project.xcxls/main/Latihan%20Dashbord.xlsx"
                onclick="switchFile(this)">
                Latihan Dashboard
            </button>
        </div>
        <a id="downloadBtn" class="download-link" href="#" download>Unduh File (.xlsx)</a>
    </div>

    <div class="viewer-container">
        <iframe id="excelViewer" src="" title="Pratinjau File Excel"></iframe>
    </div>

    <script>
        const viewer = document.getElementById("excelViewer");
        const downloadBtn = document.getElementById("downloadBtn");
        const buttons = document.querySelectorAll(".tab-btn");

        function loadExcel(rawUrl) {
            const encodedUrl = encodeURIComponent(rawUrl);
            viewer.src = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodedUrl;
            downloadBtn.href = rawUrl;
        }

        function switchFile(clickedBtn) {
            buttons.forEach(btn => btn.classList.remove("active"));
            clickedBtn.classList.add("active");
            loadExcel(clickedBtn.getAttribute("data-raw"));
        }

        // Muat file pertama saat halaman dibuka
        loadExcel(buttons[0].getAttribute("data-raw"));
    </script>
</body>
</html>
