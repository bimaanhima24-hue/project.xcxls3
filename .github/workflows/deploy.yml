name: Deploy Portal & Pharma Suite to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "pharma-suite/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1. Build modul pharm-analyst-staff
      - name: Install pharm-analyst-staff dependencies
        working-directory: pharma-suite/pharm-analyst-staff
        run: npm install

      - name: Build pharm-analyst-staff
        working-directory: pharma-suite/pharm-analyst-staff
        env:
          VITE_BASE: /project.xcxls3/pharma-suite/pharm-analyst-staff/
        run: npx vite build --base=$VITE_BASE

      - name: Add 404 fallback for pharm-analyst-staff
        run: cp pharma-suite/pharm-analyst-staff/dist/index.html pharma-suite/pharm-analyst-staff/dist/404.html

      # 2. Build modul pharma-queue
      - name: Install pharma-queue dependencies
        working-directory: pharma-suite/pharma-queue
        run: npm install

      - name: Build pharma-queue
        working-directory: pharma-suite/pharma-queue
        env:
          VITE_BASE: /project.xcxls3/pharma-suite/pharma-queue/
        run: npx vite build --base=$VITE_BASE

      - name: Add 404 fallback for pharma-queue
        run: cp pharma-suite/pharma-queue/dist/index.html pharma-suite/pharma-queue/dist/404.html

      # 3. Gabungkan portal utama + kedua hasil build modul ke _site
      - name: Assemble site with portal and both modules
        run: |
          rm -rf _site
          mkdir -p _site/pharma-suite/pharm-analyst-staff
          mkdir -p _site/pharma-suite/pharma-queue
          [ -f index.html ] && cp index.html _site/ || true
          [ -d assets ] && cp -r assets _site/ || true
          cp -r pharma-suite/pharm-analyst-staff/dist/* _site/pharma-suite/pharm-analyst-staff/
          cp -r pharma-suite/pharma-queue/dist/* _site/pharma-suite/pharma-queue/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
 [ -f "resep-4-9-may.csv" ] && cp "resep-4-9-may.csv" _site/ || true
